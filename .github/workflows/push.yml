name: CI

on: push

permissions:
  actions: read
  contents: read

concurrency:
  group: enclave-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: ".nvmrc"

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Run linter
        run: npx nx affected -t lint
        continue-on-error: true

      - name: Run prettier
        run: npx prettier --check .
        continue-on-error: true

      - name: Build libraries
        id: build
        run: npx nx affected -t build
        continue-on-error: true

      - name: Retry build with cache reset
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build failed, resetting NX cache and retrying..."
          npx nx reset
          npx nx affected -t build --skip-nx-cache

      - name: Cache build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            libs/*/dist
          key: build-${{ github.sha }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    env:
      NX_DAEMON: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: ".nvmrc"
          # node_modules is restored from the build job's cache below; the
          # install after the restore reconciles it immutably.
          install: "false"

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            libs/*/dist
          key: build-${{ github.sha }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Test libraries
        id: test
        run: npx nx affected -t test --passWithNoTests 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Log failed tests to summary
        if: steps.test.outcome == 'failure'
        run: |
          echo "## ❌ Test Failures" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Extract failed test names and error messages
          grep -A 5 "FAIL\|✕\|Error:" test-output.txt | head -100 >> $GITHUB_STEP_SUMMARY || echo "Could not extract failure details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  security-tests:
    name: Security tests
    # Playwright 1.58 has no Chromium build for Ubuntu 26.04 (ubuntu-latest);
    # go back to ubuntu-latest when @playwright/test is upgraded.
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 45
    # The security tests are in a private repository (agentfront/enclave-security-tests) and are
    # fetched with a read-only token (secret SECURITY_TESTS_TOKEN). A fork of this repository and
    # Dependabot have no access to that secret, so the job only runs for pushes to this repository,
    # which includes the branches of its own pull requests.
    #
    # The log of this job is public. Every test step runs scripts/security-tests.mjs with --summary:
    # the tests run as child processes whose output is discarded, and what is printed is a count per
    # part. No test name, no script, no value, no path. For the same reason this job uploads no
    # report and no trace. A failure is reproduced locally with the submodule checked out
    # (`yarn test:security`).
    if: github.repository == 'agentfront/enclave' && github.actor != 'dependabot[bot]'
    env:
      NX_DAEMON: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The submodule entry `security-tests` of this repository pins the commit of the tests.
      - name: Read the pinned commit of the security tests
        id: suite
        run: echo "sha=$(git rev-parse HEAD:security-tests)" >> "$GITHUB_OUTPUT"

      # Without the token the tests cannot be fetched. That is a failure, not a skip: security
      # tests that silently do not run look like tests that passed.
      - name: Check access to the security tests
        env:
          SECURITY_TESTS_TOKEN: ${{ secrets.SECURITY_TESTS_TOKEN }}
        run: |
          if [ -z "$SECURITY_TESTS_TOKEN" ]; then
            echo "::error::The secret SECURITY_TESTS_TOKEN is not set, so the security tests cannot be fetched (see SECURITY-TESTS.md)."
            exit 1
          fi

      - name: Checkout the security tests
        uses: actions/checkout@v4
        with:
          repository: agentfront/enclave-security-tests
          ref: ${{ steps.suite.outputs.sha }}
          token: ${{ secrets.SECURITY_TESTS_TOKEN }}
          path: security-tests
          persist-credentials: false

      - name: Setup Node + Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: ".nvmrc"
          # node_modules is restored from the build job's cache below; the
          # install after the restore reconciles it immutably.
          install: "false"

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            libs/*/dist
          key: build-${{ github.sha }}

      - name: Install dependencies
        run: yarn install --immutable

      # The build job builds what a push affects; these tests always run, and some specs load the
      # built packages (the worker specs, the client specs, the runtime specs).
      - name: Build the libraries under test
        run: npx nx run-many -t build --projects=ast,core,broker,client,stream,react,runtime

      - name: Run the security case suite
        run: node scripts/security-tests.mjs --suite --summary

      - name: Run the security specs
        if: success() || failure()
        run: node scripts/security-tests.mjs --specs --summary

      - name: Read Playwright version
        if: success() || failure()
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: success() || failure()
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: (success() || failure()) && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: (success() || failure()) && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the security browser specs
        if: success() || failure()
        run: node scripts/security-tests.mjs --e2e --summary

  browser-e2e:
    name: Browser E2E
    # Playwright 1.58 has no Chromium build for Ubuntu 26.04 (ubuntu-latest);
    # go back to ubuntu-latest when @playwright/test is upgraded.
    runs-on: ubuntu-24.04
    needs: build
    env:
      NX_DAEMON: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: ".nvmrc"
          install: "false"

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            libs/*/dist
          key: build-${{ github.sha }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      # The Playwright suites run in Chromium; skip the browser download when no project with an
      # e2e target (today only @enclave-vm/browser, and through it @enclave-vm/ast) is affected.
      - name: Find affected e2e projects
        id: affected
        run: |
          projects=$(npx nx show projects --affected --withTarget test-e2e | xargs)
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"
          echo "Affected e2e projects: ${projects:-none}"

      - name: Read Playwright version
        if: steps.affected.outputs.projects != ''
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.affected.outputs.projects != ''
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.affected.outputs.projects != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.affected.outputs.projects != '' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        if: steps.affected.outputs.projects != ''
        run: npx nx affected -t test-e2e --outputStyle stream

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            libs/*/playwright-report
            libs/*/test-results
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Performance
    runs-on: ubuntu-latest
    needs: build
    env:
      NX_DAEMON: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: ".nvmrc"

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            libs/*/dist
          key: build-${{ github.sha }}

      - name: Run performance tests
        run: npx nx run core:test-perf --passWithNoTests
        continue-on-error: true

      - name: Generate performance summary
        if: always()
        run: |
          if [ -f "perf-results.json" ]; then
            echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node scripts/format-perf-summary.mjs perf-results.json >> $GITHUB_STEP_SUMMARY
          else
            echo "## Performance Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No performance results found. Tests may have been skipped or failed to run." >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore
          retention-days: 30
